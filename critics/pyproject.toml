[project]
name = "lerobot-critics"
version = "0.1.0"
description = "Episode quality critics for LeRobot datasets: hard (kinematic/video) and soft (VLM) checks that decide which teleop episodes go into training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Symbiosika GmbH" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "av>=12",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "pydantic>=2.5",
  "pyyaml>=6",
  "httpx>=0.25",
  "typer>=0.12",
  "rich>=13",
  "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
hf = ["huggingface_hub>=0.23"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.25"]
all = ["lerobot-critics[gemini,api,hf,dev]"]

[project.scripts]
lerobot-critics = "lerobot_critics.cli:app"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_critics"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
