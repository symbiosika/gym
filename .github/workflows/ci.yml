name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: backend
        run: bun install
      - name: Typecheck
        working-directory: backend
        run: bun run typecheck
      - name: Tests (embedded PGlite)
        working-directory: backend
        run: bun run test:local ./src

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: frontend
        run: bun install
      - name: Tests
        working-directory: frontend
        run: bun run test
      - name: Type-check and build
        working-directory: frontend
        run: bun run build

  # The data critics (critics/): the Python analysis engine behind every
  # verdict the app shows. Two Python versions, because the service also runs
  # on a Jetson.
  critics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (the test fixture is a rendered dataset)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        working-directory: critics
        run: uv pip install --system -e ".[all]"
      - name: Lint
        working-directory: critics
        run: ruff check . && ruff format --check .
      - name: Tests
        working-directory: critics
        run: pytest -q
